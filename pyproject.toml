[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aech-cli-visualize"
version = "0.2.7"
description = "Generate arbitrary visual artifacts with GPT Image"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "openai>=2.15.0",
    "Pillow>=10.0.0,<13",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-ai-slim[anthropic,openai]>=1.44.0",
    "opentelemetry-sdk>=1.39.1,<2",
]

[project.scripts]
aech-cli-visualize = "aech_cli_visualize.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aech_cli_visualize = [
    "manifest.json",
    "skills/*/SKILL.md",
]
